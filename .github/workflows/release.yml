name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    uses: bitcoinuniverseio/.github-private/.github/workflows/route.yml@develop
    secrets: inherit
    with:
      plan: '{"package_2":"light"}'

  package:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.targets).package_2 }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run verify
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-package-candidate
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 3
