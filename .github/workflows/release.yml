name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-package-candidate
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 14
